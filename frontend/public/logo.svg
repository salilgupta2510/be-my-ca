<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none">
  <defs>
    <linearGradient id="iconbg" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <rect x="0" y="6" width="44" height="44" rx="10" fill="url(#iconbg)"/>

  <!-- Document body -->
  <rect x="8" y="11" width="20" height="27" rx="2.5" fill="white" fill-opacity="0.12"/>
  <rect x="8" y="11" width="20" height="27" rx="2.5" stroke="white" stroke-opacity="0.3" stroke-width="0.8"/>
  <line x1="11" y1="19" x2="25" y2="19" stroke="white" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round"/>
  <line x1="11" y1="23" x2="25" y2="23" stroke="white" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round"/>
  <line x1="11" y1="27" x2="20" y2="27" stroke="white" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round"/>

  <!-- Rupee badge -->
  <circle cx="31" cy="38" r="10" fill="#1e40af"/>
  <circle cx="31" cy="38" r="9.5" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.6"/>
  <circle cx="31" cy="38" r="10" fill="#3b82f6" fill-opacity="0.2"/>

  <!-- ₹ symbol in badge -->
  <line x1="26.5" y1="33.5" x2="35.5" y2="33.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="26.5" y1="36.5" x2="35.5" y2="36.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="28" y1="33.5" x2="28" y2="43" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="35" y1="36.5" x2="27.5" y2="43" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M28 33.5 Q34.5 33.5 34.5 35 Q34.5 36.5 28 36.5" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark: BeMyCa -->
  <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.5">BeMyCa</text>

