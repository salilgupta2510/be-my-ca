<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" fill="none">
  <defs>
    <linearGradient id="iconbg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="iconshine" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <rect x="0" y="4" width="48" height="48" rx="11" fill="url(#iconbg)"/>
  <rect x="0" y="4" width="48" height="48" rx="11" fill="url(#iconshine)"/>

  <!-- Document body -->
  <rect x="8" y="10" width="22" height="30" rx="2.5" fill="white" fill-opacity="0.15"/>
  <rect x="8" y="10" width="22" height="30" rx="2.5" stroke="white" stroke-opacity="0.35" stroke-width="0.8"/>
  <line x1="12" y1="18" x2="27" y2="18" stroke="white" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="22" x2="27" y2="22" stroke="white" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="26" x2="22" y2="26" stroke="white" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>

  <!-- Rupee badge -->
  <circle cx="34" cy="40" r="11" fill="#92400e"/>
  <circle cx="34" cy="40" r="11" fill="#f59e0b" fill-opacity="0.25"/>
  <circle cx="34" cy="40" r="10.5" stroke="#fcd34d" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- ₹ symbol in badge -->
  <line x1="29" y1="35" x2="39" y2="35" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="29" y1="38" x2="39" y2="38" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="31" y1="35" x2="31" y2="45.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="38.5" y1="38" x2="30.5" y2="45.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M31 35 Q38 35 38 36.5 Q38 38 31 38" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark: BeMyCa -->
  <text x="58" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="white" letter-spacing="-0.5">BeMyCa</text>

  <!-- Tagline -->
  <text x="59" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#f59e0b" fill-opacity="0.7" letter-spacing="0.4">GST Made Simple</text>
</svg>
