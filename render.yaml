services:
  - type: web
    name: gst-engine-api
    runtime: python
    plan: starter
    rootDir: gst-engine
    buildCommand: pip install -e ".[api]"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: GST_ENGINE_API_KEYS
        sync: false
      - key: GST_ENGINE_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: bemyca-api
    runtime: docker
    rootDir: .
    dockerfilePath: Dockerfile.backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GSP_BASE_URL
        value: https://api.masters-india.com
      - key: GSP_USERNAME
        sync: false
      - key: GSP_PASSWORD
        sync: false
      - key: GSP_CLIENT_ID
        sync: false
      - key: GSP_CLIENT_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
